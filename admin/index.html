<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>모티브짐 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f3;color:#171717;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#111;color:white;padding:24px}header strong{color:#ff5b1f}main{max-width:960px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid #e4dfd9;padding:28px;border-radius:8px;margin:18px 0}h1{font-size:30px}h2{font-size:19px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}input,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:4px}input{width:100%;max-width:380px}button{cursor:pointer;background:#ff5b1f;border:0;color:white;font-weight:700}button.secondary{background:#222}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.metric{background:#111;color:#fff;border-radius:6px;padding:20px}.metric strong{display:block;font-size:32px;color:#ff7a3e}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #eee;padding:10px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row input{width:auto}.message{color:#ab3800}.muted{color:#555} [hidden]{display:none!important}
</style></head><body><header><strong>MOTIVE GYM</strong> · 관리자</header><main><h1>신체 나이 테스트 현황</h1><section class="card" id="login"><h2>관리자 로그인</h2><form id="login-form"><label for="email">아이디 (이메일)</label><input type="email" id="email" autocomplete="username" required><label for="password">비밀번호</label><input type="password" id="password" autocomplete="current-password" required><p><button>로그인</button></p></form></section><section id="dashboard" hidden><div class="row"><div><label for="from">시작일</label><input type="date" id="from"></div><div><label for="to">종료일</label><input type="date" id="to"></div><button id="refresh">조회</button><button class="secondary" id="logout">로그아웃</button></div><div class="card"><div class="grid"><div class="metric">선택 기간 테스트 완료<strong id="total">0</strong>건</div><div class="metric">당근에서 유입<strong id="karrot">0</strong>건</div></div><p class="muted">개인별 기록이 아닌 전체 합계입니다.</p></div><div class="card"><h2>고객별 테스트 기록</h2><p class="muted">저장에 동의한 고객의 기록입니다. 작성일부터 2년간 보관합니다.</p><div id="records" aria-live="polite"></div><div class="row"><button type="button" class="secondary" id="previous">이전</button><span id="page">1</span><button type="button" class="secondary" id="next">다음</button></div></div><div class="card"><h2>결과 연령대</h2><table><tbody id="ages"></tbody></table></div><div class="card"><h2>유입 경로</h2><table><tbody id="sources"></tbody></table><p class="muted">유입 경로는 링크에 표시된 정보에 따라 집계됩니다.</p></div></section><p class="message" id="message" role="status"></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Replace these two public values after the Supabase project is provisioned.
const url='https://cbxltnyccjzptqkmtsqf.supabase.co', key='sb_publishable_jDZmnxr0T23ubpMI72BLGA_grGTXqIY';
const message=document.getElementById('message'), login=document.getElementById('login'), dashboard=document.getElementById('dashboard');
if(!url.startsWith('https://')||key.startsWith('SUPABASE_')) { message.textContent='관리자 시스템 연결 준비 중입니다.'; }
else {
 const client=createClient(url,key); const from=document.getElementById('from'),to=document.getElementById('to');
 const today=new Date(); const koreaDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(today);to.value=koreaDate;const prev=new Date(today.getTime()-29*86400000);from.value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(prev);
 async function load(){message.textContent=''; const {data,error}=await client.rpc('body_test_totals',{p_from:from.value,p_to:to.value});if(error){message.textContent='통계를 불러오지 못했습니다. 관리자 권한과 기간을 확인해 주세요.';return;}let totals={}; for(const row of data){const k=row.category+'|'+row.value;totals[k]=(totals[k]||0)+Number(row.count)}document.getElementById('total').textContent=totals['완료|전체']||0;document.getElementById('karrot').textContent=totals['유입|당근']||0;function render(id,category,items){const el=document.getElementById(id);el.replaceChildren();for(const name of items){const tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=name;b.textContent=(totals[category+'|'+name]||0)+'건';tr.append(a,b);el.append(tr)}}render('ages','결과 연령대',['20세 미만','20대','30대','40대','50대','60대','70대 이상']);render('sources','유입',['당근','홈페이지','기타']);}
let offset=0;const size=20;
 async function loadRecords(){
   const out=document.getElementById('records');out.textContent='불러오는 중입니다.';
   const {data,error}=await client.rpc('list_body_check_records',{p_from:from.value,p_to:to.value,p_limit:size,p_offset:offset});
   if(error){out.textContent='고객 기록을 불러오지 못했습니다. 관리자 권한과 조회 기간을 확인해 주세요.';return;}
   out.replaceChildren();
   if(!data.length)out.textContent='이 기간에 저장된 고객 기록이 없습니다.';
   for(const row of data){
     const r=row.record||{},box=document.createElement('details'),heading=document.createElement('summary');
     heading.textContent=(r.name||'이름 없음')+' · '+new Date(row.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · 신체 나이 '+r.bodyAge+'세';
     box.style.cssText='border-top:1px solid #ddd;padding:16px 0';heading.style.cursor='pointer';box.append(heading);
     const p=document.createElement('p');p.textContent='나이 '+r.age+'세 · 성별 '+r.gender+' · 키 '+r.height+'cm · 몸무게 '+r.weight+'kg · 체지방률 '+r.bodyFat+'% · BMI '+r.bmi+' · 점수 '+r.score;box.append(p);
     const ol=document.createElement('ol');for(const answer of (Array.isArray(r.answers)?r.answers:[])){const li=document.createElement('li');li.style.margin='8px 0';li.textContent=answer.question+' — '+answer.answer;ol.append(li)}box.append(ol);
     const del=document.createElement('button');del.className='secondary';del.textContent='이 기록 삭제';del.type='button';del.onclick=async()=>{if(!confirm('이 고객의 기록을 삭제하시겠습니까? 삭제한 기록은 복구할 수 없습니다.'))return;del.disabled=true;const {error}=await client.rpc('delete_body_check_record',{p_id:row.id});if(error){message.textContent='삭제하지 못했습니다.';del.disabled=false;}else await loadRecords()};box.append(del);out.append(box);
   }
   document.getElementById('page').textContent=String(offset/size+1);document.getElementById('previous').disabled=offset===0;document.getElementById('next').disabled=data.length<size;
 }
 document.getElementById('previous').onclick=()=>{offset=Math.max(0,offset-size);loadRecords()};
 document.getElementById('next').onclick=()=>{offset+=size;loadRecords()};
 async function show(){const {data:{session}}=await client.auth.getSession();login.hidden=!!session;dashboard.hidden=!session;if(session){await load();await loadRecords();}}
 document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();message.textContent='';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('password').value='';if(error){message.textContent='로그인 정보를 확인해 주세요.';return;}await show()});document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();await show()});document.getElementById('refresh').addEventListener('click',async()=>{offset=0;await load();await loadRecords()});show();
}
</script></body></html>
