<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>모티브짐 관리자</title><style>
:root{--o:#ff5b1f;--i:#171717;--p:#f6f5f3}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:system-ui,'Malgun Gothic',sans-serif}header{padding:22px;background:#111;color:#fff}header b{color:var(--o)}main{max-width:1080px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4dfd9;border-radius:8px;padding:22px;margin:15px 0}h1{font-size:28px;margin:0 0 5px}h2{font-size:18px;margin:0 0 16px}.muted{color:#666;font-size:14px}.message{color:#a63809;min-height:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:17px;border-radius:7px;background:#111;color:#fff}.metric strong{display:block;font-size:28px;color:#ff7a3e;margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{flex:1 1 160px}label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,select,button{font:inherit;padding:11px;border:1px solid #cfc9c3;border-radius:5px;background:#fff;width:100%}button{width:auto;border:0;background:var(--o);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#222}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #eee;padding:10px 7px}th{font-size:12px;color:#666}.scroll{overflow:auto}.tag{font-size:12px;background:#f2efeb;border-radius:99px;padding:3px 7px}.renewal{background:#ffe1d3;color:#a63809}@media(max-width:700px){.grid,.two{grid-template-columns:1fr 1fr}.two{display:block}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><header><b>MOTIVE GYM</b> · 센터 관리자</header><main>
<section id="login" class="card"><h1>관리자 로그인</h1><p class="muted">회원·매출 정보는 로그인한 관리자만 볼 수 있습니다.</p><form id="login-form"><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" required></div><p><button>로그인</button></p></form></section>
<section id="app" class="hidden"><div class="row"><div><h1>회원·매출 관리</h1><p class="muted">등록 내역을 저장하면 센터·트레이너별 매출과 재등록률이 자동 집계됩니다.</p></div><button id="logout" class="secondary">로그아웃</button></div>
<section class="card"><div class="row"><div class="field"><label>집계 시작일</label><input id="from" type="date"></div><div class="field"><label>집계 종료일</label><input id="to" type="date"></div><button id="refresh">조회</button></div></section>
<section class="grid"><div class="metric">센터 총매출<strong id="sales">₩0</strong><span id="count">0건 등록</span></div><div class="metric">신규 등록<strong id="new">0</strong><span>선택 기간</span></div><div class="metric">재등록<strong id="renew">0</strong><span>선택 기간</span></div><div class="metric">재등록률<strong id="rate">0%</strong><span>선택 기간 등록 기준</span></div></section>
<section class="two"><div class="card"><h2>회원 등록</h2><form id="form"><div class="row"><div class="field"><label>회원명</label><input id="member" required maxlength="80"></div><div class="field"><label>담당 트레이너</label><input id="trainer" required maxlength="80" list="trainers"><datalist id="trainers"></datalist></div></div><div class="row"><div class="field"><label>등록일</label><input id="registered" type="date" required></div><div class="field"><label>등록 수업 수</label><input id="sessions" type="number" min="1" required></div></div><div class="row"><div class="field"><label>등록 가격 (원)</label><input id="price" type="number" min="0" step="1000" required></div><div class="field"><label>등록 구분</label><select id="type"><option value="new">신규</option><option value="renewal">재등록</option></select></div></div><p><button>등록 내역 저장</button></p></form></div><div class="card"><h2>트레이너별 현황</h2><div class="scroll"><table><thead><tr><th>트레이너</th><th>매출</th><th>등록</th><th>재등록률</th></tr></thead><tbody id="summary"></tbody></table></div><p class="muted">재등록률 = 선택 기간 내 재등록 ÷ 전체 등록</p></div></section>
<section class="card"><h2>트레이너별 최근 6개월 재등록률</h2><div class="scroll"><table><thead><tr><th>기간</th><th>트레이너</th><th>전체 등록</th><th>재등록</th><th>재등록률</th></tr></thead><tbody id="six"></tbody></table></div></section>
<section class="card"><h2>최근 등록 내역</h2><div class="scroll"><table><thead><tr><th>등록일</th><th>회원</th><th>트레이너</th><th>수업</th><th>구분</th><th>가격</th></tr></thead><tbody id="list"></tbody></table></div></section></section><p id="msg" class="message" role="status"></p></main>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cbxltnyccjzptqkmtsqf.supabase.co','sb_publishable_jDZmnxr0T23ubpMI72BLGA_grGTXqIY'),$=x=>document.getElementById(x),won=n=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(n||0),day=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(d),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];function dates(){let n=new Date(),s=new Date(n);s.setMonth(s.getMonth()-5);s.setDate(1);$('to').value=day(n);$('from').value=day(s);$('registered').value=day(n)}function chosen(){return rows.filter(x=>x.registered_at>=$('from').value&&x.registered_at<=$('to').value)}function group(a){let r={};for(let x of a){let v=r[x.trainer_name]??={sales:0,count:0,renew:0};v.sales+=+x.price;v.count++;v.renew+=x.is_renewal?1:0;r[x.trainer_name]=v}return r}function table(id,html,empty,span){$(id).innerHTML=html||`<tr><td colspan="${span}" class="muted">${empty}</td></tr>`}function render(){let a=chosen(),g=group(a),renew=a.filter(x=>x.is_renewal).length;$('sales').textContent=won(a.reduce((n,x)=>n+(+x.price),0));$('count').textContent=`${a.length}건 등록`;$('new').textContent=a.length-renew;$('renew').textContent=renew;$('rate').textContent=a.length?Math.round(renew/a.length*100)+'%':'0%';table('summary',Object.entries(g).map(([n,v])=>`<tr><td>${safe(n)}</td><td>${won(v.sales)}</td><td>${v.count}건</td><td>${Math.round(v.renew/v.count*100)}%</td></tr>`).join(''),'등록 내역이 없습니다.',4);table('list',rows.slice(0,30).map(x=>`<tr><td>${x.registered_at}</td><td>${safe(x.member_name)}</td><td>${safe(x.trainer_name)}</td><td>${x.session_count}회</td><td><span class="tag ${x.is_renewal?'renewal':''}">${x.is_renewal?'재등록':'신규'}</span></td><td>${won(x.price)}</td></tr>`).join(''),'등록 내역이 없습니다.',6);$('trainers').innerHTML=[...new Set(rows.map(x=>x.trainer_name))].sort().map(x=>`<option value="${safe(x)}">`).join('');let e=new Date(`${$('to').value}T12:00`),s=new Date(e);s.setMonth(s.getMonth()-6),six=group(rows.filter(x=>new Date(`${x.registered_at}T12:00`)>=s&&new Date(`${x.registered_at}T12:00`)<=e));table('six',Object.entries(six).map(([n,v])=>`<tr><td>${day(s)} ~ ${$('to').value}</td><td>${safe(n)}</td><td>${v.count}건</td><td>${v.renew}건</td><td>${Math.round(v.renew/v.count*100)}%</td></tr>`).join(''),'최근 6개월 등록 내역이 없습니다.',5)}async function load(){let{data,error}=await db.from('member_enrollments').select('member_name,trainer_name,registered_at,session_count,price,is_renewal').order('registered_at',{ascending:false}).limit(1000);if(error){$('msg').textContent='회원 관리 데이터가 아직 준비되지 않았습니다. Supabase 설정을 먼저 적용해 주세요.';return}rows=data||[];render()}async function show(){let{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session)await load()}$('login-form').onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)$('msg').textContent='로그인 정보를 확인해 주세요.';else show()};$('logout').onclick=async()=>{await db.auth.signOut();show()};$('refresh').onclick=render;$('form').onsubmit=async e=>{e.preventDefault();let{error}=await db.from('member_enrollments').insert({member_name:$('member').value.trim(),trainer_name:$('trainer').value.trim(),registered_at:$('registered').value,session_count:+$('sessions').value,price:+$('price').value,is_renewal:$('type').value==='renewal'});if(error){$('msg').textContent='저장하지 못했습니다. 입력값과 관리자 권한을 확인해 주세요.';return}$('form').reset();$('registered').value=day(new Date());$('msg').textContent='등록 내역을 저장했습니다.';load()};dates();show();</script></body></html>
