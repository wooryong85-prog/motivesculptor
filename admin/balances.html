<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이월 잔여 수업 · 모티브짐</title><style>body{font-family:system-ui,sans-serif;background:#f5f4f2;color:#151515;margin:0}header{background:#111;color:white;padding:18px}header a{color:#ff6826;text-decoration:none}main{max-width:1100px;margin:24px auto;padding:0 15px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin:12px 0}h1{font-size:23px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metrics strong{display:block;color:#e85b1d;font-size:27px}input,select{font:inherit;padding:10px;border:1px solid #bbb;border-radius:6px}input{width:min(100%,340px)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}th{background:#eee}tr:nth-child(even){background:#fafafa}.muted{color:#666}@media(max-width:600px){.metrics{grid-template-columns:1fr}}</style><header><a href="/admin/">← MOTIVE GYM · 센터 운영</a></header><main><h1>이월 잔여 수업</h1><p class="muted">2026년 10월 31일 정산표 기준입니다. 11월 수업은 확인 후 차감합니다. 이월 자료는 신규 매출과 10월 급여에 다시 합산하지 않습니다.</p><div id="state" role="status">로그인 확인 중…</div><section id="data" hidden><div class="metrics"><div class="card">운영 계약<strong id="n"></strong></div><div class="card">운영 잔여<strong id="rem"></strong></div><div class="card">휴회 잔여<strong id="paused"></strong></div></div><div class="card"><label>회원·담당 검색 <input id="q" type="search" placeholder="이름 입력"></label> <select id="filter"><option value="all">전체</option><option value="active_baseline">운영 중</option><option value="paused">휴회</option><option value="expired_review">만료 검토</option></select></div><div class="card scroll"><table><thead><tr><th>회원</th><th>담당</th><th>등록</th><th>총회차</th><th>10월 말 완료</th><th>10월 말 잔여</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cbxltnyccjzptqkmtsqf.supabase.co','sb_publishable_jDZmnxr0T23ubpMI72BLGA_grGTXqIY');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const session=(await db.auth.getSession()).data.session;if(!session){$('state').innerHTML='<a href="/admin/">관리자 로그인으로 이동</a>'}else if(session.user.id!=='99446214-0f1e-409f-a8c9-efef0ad29075'){$('state').textContent='관리자만 볼 수 있습니다.'}else{const r=await db.from('historical_opening_balances').select('*').order('trainer_id').order('member_name');if(r.error){$('state').textContent='자료를 불러오지 못했습니다: '+r.error.message}else{const data=r.data||[],trainer={2:'최수연',3:'최원석',4:'방기태'};$('n').textContent=data.filter(x=>x.operating_status==='active_baseline').length+'건';$('rem').textContent=data.filter(x=>x.operating_status==='active_baseline').reduce((a,x)=>a+x.remaining_count,0)+'회';$('paused').textContent=data.filter(x=>x.operating_status==='paused').reduce((a,x)=>a+x.remaining_count,0)+'회';function render(){const q=$('q').value.trim(),f=$('filter').value;$('rows').innerHTML=data.filter(x=>(f==='all'||x.operating_status===f)&&(!q||x.member_name.includes(q)||(trainer[x.trainer_id]||'').includes(q))).map(x=>'<tr><td>'+esc(x.member_name)+'</td><td>'+esc(trainer[x.trainer_id])+'</td><td>'+esc(x.registration_date||'확인 중')+'</td><td>'+x.session_count+'</td><td>'+x.completed_count+'</td><td><strong>'+x.remaining_count+'</strong></td><td>'+esc({active_baseline:'운영 중',paused:'휴회',expired_review:'만료 검토'}[x.operating_status])+'</td></tr>').join('')||'<tr><td colspan="7">해당 계약이 없습니다.</td></tr>'}$('q').oninput=render;$('filter').onchange=render;render();$('state').hidden=true;$('data').hidden=false}}</script></html>
