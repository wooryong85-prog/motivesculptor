<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 비밀번호 재설정 | 모티브짐</title><style>body{margin:0;background:#f6f5f3;color:#171717;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:440px;margin:12vh auto;padding:0 20px}.card{background:#fff;border:1px solid #e4dfd9;border-radius:8px;padding:28px}b{color:#ff5b1f}h1{font-size:25px}label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}input,button{width:100%;box-sizing:border-box;padding:12px;font:inherit;border-radius:5px}input{border:1px solid #ccc}button{margin-top:18px;border:0;background:#ff5b1f;color:#fff;font-weight:700}.message{color:#a63809;min-height:22px}</style></head><body><main><div class="card"><b>MOTIVE GYM</b><h1>관리자 비밀번호 재설정</h1><p>새 비밀번호를 입력해 주세요.</p><form id="form"><label for="password">새 비밀번호</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button>비밀번호 저장</button></form><p id="message" class="message" role="status"></p></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cbxltnyccjzptqkmtsqf.supabase.co','sb_publishable_jDZmnxr0T23ubpMI72BLGA_grGTXqIY'),f=document.getElementById('form'),m=document.getElementById('message');f.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){m.textContent='비밀번호가 일치하지 않습니다.';return}const{error}=await db.auth.updateUser({password:p});if(error){m.textContent='재설정 링크가 만료되었거나 올바르지 않습니다. 새 재설정 메일을 요청해 주세요.';return}m.textContent='비밀번호를 변경했습니다. 관리자 로그인 화면으로 이동합니다.';setTimeout(()=>location.href='./',1200)}</script></body></html>
